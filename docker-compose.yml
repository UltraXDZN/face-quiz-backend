services:
  backend:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - FIREBASE_CREDENTIALS_PATH=/app/serviceAccountKey.json
      - BACKEND_URL=https://fipu-blic.unipu.hr/api
      - FRONTEND_URL=https://fipu-blic.unipu.hr
    volumes:
      - ./serviceAccountKey.json:/app/serviceAccountKey.json:ro
    restart: unless-stopped
